name: website ⚙️

on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/website.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true
      - '.github/workflows/website.yml'

permissions:

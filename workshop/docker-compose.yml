services:
  jupyter:
    container_name: istsos4-workshop-jupyter
    build:
      context: jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./jupyter/content:/home/jovyan/content
    networks:
      - istsos4-workshop-net

  database:
    image: ghcr.io/istsos/istsos4/database:1.8
    container_name: istsos4-workshop-database
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATADIR: /var/lib/postgresql/data
    command: >
      postgres
        -c custom.network=${NETWORK:-0}
        -c custom.versioning=${VERSIONING:-0}
        -c custom.authorization=${AUTHORIZATION:-0}
        -c custom.duplicates=${DUPLICATES:-0}
        -c custom.epsg=${EPSG:-4326}
        -c custom.user=${ISTSOS_ADMIN:-admin}
        -c custom.password=${ISTSOS_ADMIN_PASSWORD:-admin}
        -c log_statement="all"
        -c log_destination="stderr"
        -c log_duration="on"
    ports:
      - ${POSTGRES_EXTERNAL_PORT}:5432
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - istsos4-workshop-net

  api:
    image: ghcr.io/istsos/istsos4/api:1.16
    container_name: istsos4-workshop-api
    restart: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      HOSTNAME: ${HOSTNAME}
      SUBPATH: ${SUBPATH}
      VERSION: ${VERSION}
      DEBUG: ${DEBUG}
      VERSIONING: ${VERSIONING}
      POSTGRES_DB: ${POSTGRES_DB}
      ISTSOS_ADMIN: ${ISTSOS_ADMIN}
      ISTSOS_ADMIN_PASSWORD: ${ISTSOS_ADMIN_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      PG_MAX_OVERFLOW: ${PG_MAX_OVERFLOW}
      PG_POOL_SIZE: ${PG_POOL_SIZE}
      PG_POOL_TIMEOUT: ${PG_POOL_TIMEOUT}
      COUNT_MODE: ${COUNT_MODE}
      COUNT_ESTIMATE_THRESHOLD: ${COUNT_ESTIMATE_THRESHOLD}
      TOP_VALUE: ${TOP_VALUE}
      PARTITION_CHUNK: ${PARTITION_CHUNK}
      REDIS: ${REDIS}
      EPSG: ${EPSG}
      AUTHORIZATION: ${AUTHORIZATION}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      ALGORITHM: ${ALGORITHM}
      ANONYMOUS_VIEWER: ${ANONYMOUS_VIEWER}
      NETWORK: ${NETWORK}
      ST_AGGREGATE: ${ST_AGGREGATE}
    command: uvicorn --timeout-keep-alive 75 --workers 2 --host 0.0.0.0 --port 5000 app.main:app
    ports:
      - ${EXTERNAL_PORT}:5000
    working_dir: /code
    networks:
      - istsos4-workshop-net

  redis:
    image: redis:7.4.0-alpine3.20
    container_name: istsos4-workshop-redis
    restart: always
    networks:
      - istsos4-workshop-net

  grafana:
    image: ghcr.io/istsos/supsi-istsos4-grafana:0.1
    container_name: istsos4-workshop-grafana
    ports:
      - 3000:3000
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SERVER_DOMAIN: istsos.org
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: supsi-istsos4
      GF_SERVER_ROOT_URL: https://istsos.org/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: true
      GF_SECURITY_ALLOW_EMBEDDING: true
      GF_SECURITY_COOKIE_SAMESITE: lax
    volumes:
      - v-istsos4-workshop-grafana:/var/lib/grafana

  gui:
    image: ghcr.io/istsos/istsos4/gui:1.0
    container_name: istsos4-workshop-gui
    restart: always
    ports:
      - 2000:3000
    environment:
      NEXT_PUBLIC_BASE_PATH: /gui
    networks:
      - istsos4-workshop-net


  dummy_data:
    image: ghcr.io/istsos/istsos4/dummy_data:1.7
    container_name: istsos4-workshop-dummy-data
    command: python3 generator.py
    working_dir: /dummy_data
    environment:
      HOSTNAME: ${HOSTNAME}
      SUBPATH: ${SUBPATH}
      VERSION: ${VERSION}
      VERSIONING: ${VERSIONING}
      POSTGRES_DB: ${POSTGRES_DB}
      ISTSOS_ADMIN: ${ISTSOS_ADMIN}
      ISTSOS_ADMIN_PASSWORD: ${ISTSOS_ADMIN_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      DUMMY_DATA: ${DUMMY_DATA}
      CLEAR_DATA: ${CLEAR_DATA}
      N_THINGS: ${N_THINGS}
      N_OBSERVED_PROPERTIES: ${N_OBSERVED_PROPERTIES}
      INTERVAL: ${INTERVAL}
      FREQUENCY: ${FREQUENCY}
      START_DATETIME: ${START_DATETIME}
      CHUNK_INTERVAL: ${CHUNK_INTERVAL}
      EPSG: ${EPSG}
      AUTHORIZATION: ${AUTHORIZATION}
      NETWORK: ${NETWORK}
      ST_AGGREGATE: ${ST_AGGREGATE}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - istsos4-workshop-net

volumes:
  v-istsos4-workshop-grafana:
    name: v-istsos4-workshop-grafana
    
networks:
  istsos4-workshop-net:
    driver: bridge
